<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>October 03, 2026 - Happy 32nd Monthsary Myluvssss ❤️</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Poppins", sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffd6e7, #fff0f6);
            overflow: hidden;
            color: #6b2145;
        }

        .container {
            text-align: center;
            padding: 30px;
            animation: fadeIn 2s ease;
        }

        .heart {
            font-size: 90px;
            animation: heartbeat 1.5s infinite;
        }

        .date {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #9b315d;
        }

        .photo {
            width: 250px;
            height: auto;
            border-radius: 15px;
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        h1 {
            font-size: 42px;
            margin: 15px 0;
        }

        p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            background: #e75480;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c93d68;
            transform: scale(1.05);
        }

        .floating-heart {
            position: absolute;
            color: #e75480;
            font-size: 25px;
            animation: float 6s linear infinite;
            bottom: -50px;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            from {
                transform: translateY(0);
                opacity: 1;
            }

            to {
                transform: translateY(-110vh);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart">❤️</div>

        <div class="date">
            October 03, 2026
            <p>Saturday</p>
            </div>


        <h1>
            Happy 32nd Monthsary, Myluvssss! ❤️
        </h1>

        <p>
            Another month with you, another beautiful memory to treasure.
            💕
        </p>

        <button onclick="goToPage2()">
            Open My Surprise 💌
        </button>

    </div>

    <script>

        function goToPage2() {
            window.location.href = "page2.html";
        }

        function createHeart() {

            const heart = document.createElement("div");

            heart.className = "floating-heart";

            heart.innerHTML = "♥";

            heart.style.left = Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (Math.random() * 3 + 4) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createHeart, 500);

    </script>

</body>
</html>
